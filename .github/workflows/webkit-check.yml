name: WebKit check

# Loads the published web build in WebKit (Safari's engine) on an emulated iPhone
# and a desktop, and logs errors and screenshots, to debug Safari-only problems.

on:
  # Runs when the check itself changes (edit scripts/ci/webkit-check.mjs to re-run it).
  push:
    branches: [claude/dreamy-bell-vi4u67]
    paths: [scripts/ci/webkit-check.mjs, .github/workflows/webkit-check.yml]
  workflow_dispatch:
    inputs:
      url:
        description: Page to load
        default: https://jmsabbitt.github.io/Falloutshelterremake/

jobs:
  webkit:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null && npm i playwright@1.56.0
      - run: npx playwright install webkit
      - run: node scripts/ci/webkit-check.mjs "${{ inputs.url || 'https://jmsabbitt.github.io/Falloutshelterremake/' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-screenshots
          path: webkit-*.png
