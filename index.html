<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2a2f" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Homestead" />
    <title>Homestead</title>
    <link rel="icon" href="./icons/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <!-- Boot screen: the painted splash (ART-LIST X2) until the game has started, then it fades out. -->
    <div id="boot-splash" aria-label="Homestead is loading" role="img">
      <div class="boot-caption">Homestead</div>
    </div>
    <style>
      #boot-splash { position: fixed; inset: 0; z-index: 99990; background: #1b2a2f url('./sprites/app/splash.webp') center / cover no-repeat; transition: opacity 0.45s ease-out; }
      #boot-splash::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(12, 18, 20, 0.85), transparent 32%); }
      #boot-splash .boot-caption { position: absolute; left: 0; right: 0; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); z-index: 1; text-align: center; color: #f2c14e; font: 700 15px/1 system-ui, sans-serif; letter-spacing: 0.3em; text-transform: uppercase; text-shadow: 0 2px 4px #000; animation: boot-pulse 1.4s ease-in-out infinite alternate; }
      #boot-splash.gone { opacity: 0; pointer-events: none; }
      @keyframes boot-pulse { from { opacity: 0.45; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #boot-splash .boot-caption { animation: none; } }
    </style>
    <script>
      // Boot diagnostics: a visible panel for errors (and a start-up that never finishes),
      // so a playtester on a phone without developer tools can screenshot what went wrong.
      (function () {
        var box = null;
        function show(msg) {
          if (!box) {
            box = document.createElement('div');
            box.id = 'boot-errors';
            box.setAttribute('style', 'position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:99999;max-height:45vh;overflow:auto;background:#2b0f0a;color:#ffd9cf;border:1px solid #e4572e;border-radius:8px;padding:10px 12px;font:12px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap');
            var close = document.createElement('button');
            close.textContent = 'Dismiss';
            close.setAttribute('style', 'float:right;min-height:32px;margin:0 0 6px 8px');
            close.onclick = function () { box.remove(); box = null; };
            box.appendChild(close);
            box.appendChild(document.createTextNode('Something went wrong. Please screenshot this.\n' + navigator.userAgent + '\n'));
            (document.body || document.documentElement).appendChild(box);
          }
          box.appendChild(document.createTextNode('\n• ' + msg));
        }
        window.__bootError = show;
        window.addEventListener('error', function (e) {
          // Capture phase also sees files that failed to load (a script or stylesheet),
          // which otherwise leave a silent black screen.
          var t = e.target;
          if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
            show('Could not load ' + (t.src || t.href || t.tagName));
            return;
          }
          show((e.message || 'error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno + ':' + e.colno : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show('Unhandled: ' + (r && (r.stack || r.message) ? String(r.stack || r.message).slice(0, 600) : String(r)));
        });
        setTimeout(function () {
          if (!window.__homesteadBooted) show('The game has not finished starting after 20 s (stuck while loading).');
        }, 20000);
        // The boot screen leaves once the game is up (and the painted UI has had a moment to load).
        var splashWait = setInterval(function () {
          if (!window.__homesteadBooted) return;
          clearInterval(splashWait);
          var s = document.getElementById('boot-splash');
          if (!s) return;
          setTimeout(function () {
            s.classList.add('gone');
            setTimeout(function () { s.remove(); }, 600);
          }, 250);
        }, 50);
      })();
    </script>
    <div id="stage"></div>
    <div id="ui"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
