<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2a2f" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Homestead" />
    <title>Homestead</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <script>
      // Boot diagnostics: a visible panel for errors (and a start-up that never finishes),
      // so a playtester on a phone without developer tools can screenshot what went wrong.
      (function () {
        var box = null;
        function show(msg) {
          if (!box) {
            box = document.createElement('div');
            box.id = 'boot-errors';
            box.setAttribute('style', 'position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:99999;max-height:45vh;overflow:auto;background:#2b0f0a;color:#ffd9cf;border:1px solid #e4572e;border-radius:8px;padding:10px 12px;font:12px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap');
            var close = document.createElement('button');
            close.textContent = 'Dismiss';
            close.setAttribute('style', 'float:right;min-height:32px;margin:0 0 6px 8px');
            close.onclick = function () { box.remove(); box = null; };
            box.appendChild(close);
            box.appendChild(document.createTextNode('Something went wrong. Please screenshot this.\n' + navigator.userAgent + '\n'));
            (document.body || document.documentElement).appendChild(box);
          }
          box.appendChild(document.createTextNode('\n• ' + msg));
        }
        window.__bootError = show;
        window.addEventListener('error', function (e) {
          // Capture phase also sees files that failed to load (a script or stylesheet),
          // which otherwise leave a silent black screen.
          var t = e.target;
          if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
            show('Could not load ' + (t.src || t.href || t.tagName));
            return;
          }
          show((e.message || 'error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno + ':' + e.colno : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show('Unhandled: ' + (r && (r.stack || r.message) ? String(r.stack || r.message).slice(0, 600) : String(r)));
        });
        setTimeout(function () {
          if (!window.__homesteadBooted) show('The game has not finished starting after 20 s (stuck while loading).');
        }, 20000);
      })();
    </script>
    <div id="stage"></div>
    <div id="ui"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
